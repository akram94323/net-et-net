# Met à jour chaque jour les avis Google affichés sur la page d'accueil.
# Prérequis : secret GOOGLE_PLACES_API_KEY (Settings → Secrets and variables → Actions).
# Lancement manuel possible : onglet Actions → « Avis Google » → Run workflow.
name: Avis Google

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6 h / 7 h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write   # enregistrer la page mise à jour
  pages: write      # relancer la publication GitHub Pages

concurrency:
  group: avis-google
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les avis Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/avis_google.py

      - name: Publier si les avis ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/avis-config.json
          git commit -m "Avis Google : mise à jour automatique"
          git push
          # Les envois faits par ce robot ne déclenchent pas toujours la publication : on la demande explicitement.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Publication non relancée (elle se fera au prochain envoi)."
